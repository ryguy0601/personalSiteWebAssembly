<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting to app...</p>
    <script>
        // Save the intended path (preserve full subpath)
        var redirectTo = window.location.protocol + "//" + window.location.host +
            window.location.pathname +
            window.location.search +
            window.location.hash;

        sessionStorage.redirect = redirectTo;

        // Always redirect to the SPA entry point
        window.location.replace("/personalSiteWebAssembly/index.html");
    </script>
</body>
</html>
